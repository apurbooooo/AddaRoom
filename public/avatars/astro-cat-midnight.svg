<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1a2e"/>
      <stop offset="100%" stop-color="#050d18"/>
    </radialGradient>
    <radialGradient id="helmet-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2244aa"/>
      <stop offset="100%" stop-color="#091a44"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="60" fill="url(#bg)"/>
  <!-- Space suit body -->
  <ellipse cx="60" cy="104" rx="36" ry="22" fill="#1e3a60"/>
  <ellipse cx="60" cy="98" rx="30" ry="18" fill="#2a4a78"/>
  <!-- Suit badge -->
  <circle cx="60" cy="90" r="6" fill="#091a44" stroke="#BBFB2B" stroke-width="1.5"/>
  <text x="60" y="93" text-anchor="middle" font-size="6" fill="#BBFB2B" font-family="monospace">AR</text>
  <!-- Helmet outer shell -->
  <ellipse cx="60" cy="62" rx="30" ry="32" fill="url(#helmet-glow)" stroke="#3a6aaa" stroke-width="2"/>
  <!-- Helmet visor -->
  <ellipse cx="60" cy="62" rx="22" ry="24" fill="#0d2060" opacity="0.9"/>
  <!-- Visor reflection -->
  <ellipse cx="52" cy="52" rx="8" ry="6" fill="white" opacity="0.08"/>
  <!-- Cat face inside helmet -->
  <!-- Cat ears (inside visor) -->
  <polygon points="50,45 54,52 46,52" fill="#ff9966"/>
  <polygon points="70,45 74,52 66,52" fill="#ff9966"/>
  <polygon points="51,46 54,51 48,51" fill="#ffccaa"/>
  <polygon points="69,46 72,51 66,51" fill="#ffccaa"/>
  <!-- Cat face -->
  <ellipse cx="60" cy="62" rx="16" ry="17" fill="#ff9966"/>
  <!-- Cat eyes -->
  <ellipse cx="53" cy="61" rx="4.5" ry="5" fill="#1a0a30"/>
  <ellipse cx="67" cy="61" rx="4.5" ry="5" fill="#1a0a30"/>
  <!-- Iris -->
  <ellipse cx="53" cy="61" rx="2" ry="4" fill="#BBFB2B"/>
  <ellipse cx="67" cy="61" rx="2" ry="4" fill="#BBFB2B"/>
  <!-- Pupils -->
  <ellipse cx="53" cy="61" rx="1" ry="3.5" fill="#050d18"/>
  <ellipse cx="67" cy="61" rx="1" ry="3.5" fill="#050d18"/>
  <!-- Nose -->
  <ellipse cx="60" cy="68" rx="3" ry="2" fill="#c46040"/>
  <!-- Cat mouth -->
  <path d="M57 70 Q60 73 63 70" stroke="#c46040" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M57 70 Q54 72 52 70" stroke="#c46040" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M63 70 Q66 72 68 70" stroke="#c46040" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="38" y1="66" x2="52" y2="68" stroke="#c46040" stroke-width="0.8" opacity="0.6"/>
  <line x1="38" y1="70" x2="52" y2="70" stroke="#c46040" stroke-width="0.8" opacity="0.6"/>
  <line x1="68" y1="68" x2="82" y2="66" stroke="#c46040" stroke-width="0.8" opacity="0.6"/>
  <line x1="68" y1="70" x2="82" y2="70" stroke="#c46040" stroke-width="0.8" opacity="0.6"/>
  <!-- Stars around helmet -->
  <circle cx="20" cy="25" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="96" cy="20" r="1" fill="white" opacity="0.6"/>
  <circle cx="14" cy="70" r="1" fill="#BBFB2B" opacity="0.7"/>
  <circle cx="104" cy="80" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="88" cy="14" r="1" fill="white" opacity="0.7"/>
</svg>
