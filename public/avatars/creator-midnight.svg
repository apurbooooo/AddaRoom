  <path d="M40 58 Q36 72 38 90" stroke="#3d2a10" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M44 54 Q40 68 42 86" stroke="#4a3418" stroke-width="5" fill="none" stroke-linecap="round"/>
