  <path d="M47 61 Q52 59 57 61" stroke="#2d1a08" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M63 61 Q68 59 73 61" stroke="#2d1a08" stroke-width="1.8" fill="none" stroke-linecap="round"/>
