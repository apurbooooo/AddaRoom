  <path d="M70 46 Q72 60 70 78" stroke="#3d2a10" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Ears -->
  <ellipse cx="39" cy="68" rx="3.5" ry="4" fill="#c8b090"/>
  <ellipse cx="81" cy="68" rx="3.5" ry="4" fill="#c8b090"/>
  <!-- Eyes -->
  <ellipse cx="52" cy="67" rx="4.5" ry="4.5" fill="white"/>
  <ellipse cx="68" cy="67" rx="4.5" ry="4.5" fill="white"/>
  <circle cx="52.5" cy="67.5" r="3" fill="#2d1a08"/>
