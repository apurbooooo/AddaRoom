  <path d="M38 52 Q38 64 40 70" stroke="#1a0a06" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M82 52 Q82 64 80 70" stroke="#1a0a06" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Ear -->
  <ellipse cx="39" cy="68" rx="3.5" ry="4.5" fill="#d4a882"/>
  <ellipse cx="81" cy="68" rx="3.5" ry="4.5" fill="#d4a882"/>
  <!-- Eyes -->
  <ellipse cx="52" cy="68" rx="4.5" ry="4.5" fill="white"/>
  <ellipse cx="68" cy="68" rx="4.5" ry="4.5" fill="white"/>
  <circle cx="52.5" cy="68" r="3" fill="#1a0a06"/>
  <circle cx="68.5" cy="68" r="3" fill="#1a0a06"/>
  <circle cx="53.3" cy="67" r="1" fill="white"/>
  <circle cx="69.3" cy="67" r="1" fill="white"/>
  <!-- Eyebrows -->
  <path d="M47 62 Q52 59.5 57 62" stroke="#1a0a06" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M63 62 Q68 59.5 73 62" stroke="#1a0a06" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Stubble hint -->
