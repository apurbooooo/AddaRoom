<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#070f1c"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="60" fill="url(#bg)"/>
  <!-- Body / shirt -->
  <ellipse cx="60" cy="104" rx="34" ry="24" fill="#1a2840"/>
  <path d="M28 104 Q32 84 60 80 Q88 84 92 104Z" fill="#1e3050"/>
