  <ellipse cx="60" cy="48" rx="22" ry="12" fill="#1a0a06"/>
  <rect x="38" y="52" width="6" height="12" rx="2" fill="#1a0a06"/>
  <rect x="76" y="52" width="6" height="12" rx="2" fill="#1a0a06"/>
