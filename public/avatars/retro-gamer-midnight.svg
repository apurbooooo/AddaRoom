  </defs>
  <circle cx="60" cy="60" r="60" fill="url(#bg)"/>
  <!-- Body / hoodie -->
  <ellipse cx="60" cy="100" rx="34" ry="28" fill="#1e3a5f"/>
  <ellipse cx="60" cy="96" rx="26" ry="22" fill="#243c5e"/>
  <!-- Hoodie logo -->
  <path d="M54 92 Q60 88 66 92 Q60 96 54 92Z" fill="#BBFB2B" opacity="0.8"/>
